<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket STOMP Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      #chat-box {
        margin-top: 20px;
        border: 1px solid #ccc;
        padding: 10px;
        max-width: 600px;
        max-height: 300px;
        overflow-y: scroll;
      }
      #message-box {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>WebSocket STOMP Test</h1>

    <!-- Login Form for Token -->
    <div id="login">
      <h3>Login with Token</h3>
      <input type="text" id="token" placeholder="Enter your JWT token" />
      <button onclick="login()">Login</button>
    </div>

    <!-- WebSocket Chat Interface -->
    <div id="chat" style="display: none">
      <h3>Chat</h3>
      <div id="chat-box"></div>

      <div id="message-box">
        <input type="text" id="recipientId" placeholder="Recipient ID" />
        <input type="text" id="message" placeholder="Enter message" />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script>
      let stompClient = null;
      let token = null;
      let chatBox = document.getElementById("chat-box");

      // Login function to connect with JWT token
      function login() {
        token = document.getElementById("token").value;
        if (!token) {
          alert("Please enter your JWT token");
          return;
        }

        alert("Logged in successfully!");

        // Show chat interface after login
        document.getElementById("login").style.display = "none";
        document.getElementById("chat").style.display = "block";

        connectWebSocket();
      }

      // Connect to WebSocket with STOMP
      function connectWebSocket() {
        const socket = new SockJS("http://localhost:8080/ws");
        stompClient = Stomp.over(socket);

        // Connect STOMP with token in headers
        stompClient.connect(
          { Authorization: `Bearer ${token}` },
          function (frame) {
            console.log("Connected: " + frame);
            chatBox.innerHTML += "<p><em>Connected to WebSocket</em></p>";

            // Subscribe to /queue/reply for personal replies
            stompClient.subscribe("/user/queue/reply", function (message) {
              displayMessage("Reply: " + message.body);
            });

            // Subscribe to /queue/messages for direct messages
            stompClient.subscribe("/user/queue/messages", function (message) {
              displayMessage("Direct Message: " + message.body);
            });
          },
          function (error) {
            console.error("WebSocket connection error:", error);
            alert("WebSocket connection error");
          }
        );
      }

      // Send a message through WebSocket
      function sendMessage() {
        const message = document.getElementById("message").value;
        const recipientId = document.getElementById("recipientId").value;

        if (message && recipientId && stompClient && stompClient.connected) {
          const msg = {
            recipient_id: recipientId,
            content: message,
          };

          stompClient.send("/app/user.sendMessage", {}, JSON.stringify(msg));
          document.getElementById("message").value = "";
        } else {
          alert("Please enter a message and recipient ID");
        }
      }

      // Display received messages in chat box
      function displayMessage(message) {
        chatBox.innerHTML += `<p>${message}</p>`;
        chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to the latest message
      }
    </script>
  </body>
</html>
